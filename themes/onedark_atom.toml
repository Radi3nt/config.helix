"diagnostic.warning".underline = { color = "dark-yellow", style = "curl" } 
"diagnostic.error".underline = { color = "dark-red", style = "curl" } 
"diagnostic.unnecessary" = { modifiers = ["dim"] }
"diagnostic.deprecated" = { modifiers = ["crossed_out"] }
"info" = { fg = "blue" , bg = "bg-blue" }
"hint" = { fg = "green", bg = "bg-green" }
